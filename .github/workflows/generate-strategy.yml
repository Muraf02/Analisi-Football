name: Genera strategia di scommessa

# A differenza delle altre automazioni, questa ti chiede dei parametri
# quando la avvii — capitale di partenza, obiettivo, range di quota —
# così puoi cambiarli ogni volta senza modificare il codice.
on:
  workflow_dispatch:
    inputs:
      starting_capital:
        description: 'Capitale di partenza (€)'
        required: true
        default: '20'
      target_capital:
        description: 'Obiettivo (€)'
        required: true
        default: '100'
      odds_min:
        description: 'Quota minima desiderata'
        required: true
        default: '1.5'
      odds_max:
        description: 'Quota massima desiderata'
        required: true
        default: '1.8'

jobs:
  generate-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del progetto
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Genera la strategia
        env:
          STARTING_CAPITAL: ${{ github.event.inputs.starting_capital }}
          TARGET_CAPITAL: ${{ github.event.inputs.target_capital }}
          ODDS_MIN: ${{ github.event.inputs.odds_min }}
          ODDS_MAX: ${{ github.event.inputs.odds_max }}
        run: python src/generate_strategy.py

      - name: Salva i risultati (report e pagina web)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/strategy.json
          git diff --staged --quiet || git commit -m "Aggiornata strategia (pagina web)"
          git push
