name: Genera previsioni partite

# Si avvia SOLO manualmente (tu decidi quando vedere le previsioni,
# non serve farlo girare ogni 6 ore come l'aggiornamento dati)
on:
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del progetto
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Genera le previsioni
        run: python src/train_model.py
